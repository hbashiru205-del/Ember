<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Ember - Chat rooms</title>
<style>
:root{--bg:#1d1022;--card:#2a1830;--line:#432b4a;--ink:#f6ecf4;--mut:#a893a8;--hot:#ff8a6b;--gold:#f4c66a}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 system-ui,sans-serif}
#app{max-width:520px;margin:auto;min-height:100vh;display:flex;flex-direction:column}
header{padding:14px 16px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line);font-weight:700;font-size:18px}
header span{flex:1}header button{background:none;border:0;color:var(--gold);font:inherit}
main{flex:1;padding:12px 16px 90px}
nav{position:fixed;bottom:0;left:0;right:0;max-width:520px;margin:auto;display:flex;background:var(--card);border-top:1px solid var(--line)}
nav button{flex:1;padding:15px 0;background:none;border:0;color:var(--mut);font:inherit}nav .on{color:var(--gold);font-weight:700}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin:8px 0}
.card h3{margin:0 0 2px;font-size:16px}small,.mut{color:var(--mut)}
.pri{background:var(--hot);color:#2a0f10;border:0;border-radius:10px;padding:10px 14px;font:inherit;font-weight:700}
.sec{background:none;border:1px solid var(--line);color:var(--ink);border-radius:10px;padding:8px 12px;font:inherit}
input{width:100%;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit}
.msg{margin:8px 0}.msg b{color:var(--gold);cursor:pointer}.me{text-align:right}.me b{color:var(--hot)}
.bar{position:fixed;bottom:0;left:0;right:0;max-width:520px;margin:auto;display:flex;gap:8px;padding:10px;background:var(--card);border-top:1px solid var(--line)}
.row{display:flex;gap:8px;align-items:center}.row>*:first-child{flex:1}
.toast{position:fixed;top:12px;left:50%;transform:translateX(-50%);background:var(--gold);color:#2a1b00;padding:9px 14px;border-radius:10px;font-weight:600;z-index:9;max-width:90%}
.err{color:#ff8f8f}
</style></head><body><div id="app"></div>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const S={me:null,tab:'rooms',room:null,dm:null,sel:null,t:'',coins:5,claimed:false,blocked:new Set(),friends:new Set(),dms:{},
rooms:[{id:1,name:'Night owls',topic:'Music, late talks',lang:'English',n:42,msgs:[['Amaka','Anyone up? Playing afrobeats.'],['Tunde','Always.']]},
{id:2,name:'Language swap',topic:'Practice any language',lang:'Mixed',n:31,msgs:[['Mei','Hello! Anyone learning Mandarin?'],['Carlos','I can help with Spanish.']]},
{id:3,name:'Campus life',topic:'Students worldwide',lang:'English',n:18,msgs:[['Fatima','Exams start next week, send help.']]}]};
const people=['Amaka','Tunde','Mei','Carlos','Fatima'],lines=['Ha, true.','Where are you from?','Tell me more.','Good point.','Same here.'];
const bad=t=>/[\w.+-]+\s*(@|\(at\))\s*[\w-]+\.\w{2,}|https?:\/\/|www\.|(\d[\s().-]*){7,}|(^|\s)@\w{3,}|whats\s*app|telegram|instagram|snap\s*chat/i.test(t);
let tt;const toast=m=>{S.t=m;render();clearTimeout(tt);tt=setTimeout(()=>{S.t='';render()},2200)};
function start(){const n=$('#n').value.trim(),d=$('#d').value,e=$('#e');
 if(n.length<2)return e.textContent='Enter a name with at least 2 characters.';
 if(!d)return e.textContent='Enter your date of birth.';
 const a=new Date();a.setFullYear(a.getFullYear()-18);
 if(new Date(d)>a)return e.textContent='You must be 18 or older to use Ember.';
 S.me=n;render()}
const go=t=>{S.tab=t;S.room=null;S.dm=null;S.sel=null;render()};
const openRoom=id=>{S.room=S.rooms.find(r=>r.id==id);S.sel=null;render()};
function mk(){const n=$('#rn').value.trim();if(n.length<3)return toast('Room name needs 3+ characters.');
 if(S.rooms.filter(r=>r.mine).length>=3)return toast('Limit: 3 rooms per person.');
 S.rooms.unshift({id:Date.now(),name:n,topic:'New room',lang:'Any',n:1,mine:1,msgs:[]});toast('Room created.')}
function say(list,who){setTimeout(()=>{const p=who||people.filter(x=>!S.blocked.has(x))[Math.floor(Math.random()*5)%Math.max(1,people.filter(x=>!S.blocked.has(x)).length)];
 if(!p||S.blocked.has(p))return;list.push([p,lines[Math.floor(Math.random()*lines.length)]]);render()},900)}
function send(){const i=$('#m'),v=i.value.trim();if(!v)return;
 if(bad(v))return toast('Contact details and links are blocked.');
 if(v.length>500)return toast('Max 500 characters.');
 const l=S.room?S.room.msgs:S.dms[S.dm];l.push([S.me,v]);say(l,S.dm);render()}
const pick=n=>{if(n!==S.me){S.sel=n;render()}};
const addf=n=>{S.friends.add(n);S.sel=null;toast(n+' added (demo: auto-accepted).')};
const blk=n=>{S.blocked.add(n);S.friends.delete(n);S.sel=null;toast(n+' blocked.')};
const rep=n=>{S.sel=null;toast('Report sent for '+n+'.')};
const dm=n=>{S.dm=n;S.dms[n]=S.dms[n]||[];S.sel=null;render()};
function claim(){if(S.claimed)return toast('Already claimed today.');S.claimed=true;S.coins+=5;toast('+5 coins');}
function msgs(l){return l.filter(m=>!S.blocked.has(m[0])).map(m=>`<div class="msg ${m[0]==S.me?'me':''}"><b onclick="pick('${esc(m[0])}')">${esc(m[0])}</b><div>${esc(m[1])}</div></div>`).join('')||'<p class="mut">No messages yet. Say hello.</p>'}
function sheet(){if(!S.sel)return'';const n=esc(S.sel);return`<div class="card"><b>${n}</b><div class="row" style="margin-top:8px"><button class="sec" onclick="addf('${n}')">Add friend</button><button class="sec" onclick="rep('${n}')">Report</button><button class="sec" onclick="blk('${n}')">Block</button></div></div>`}
function view(){
 if(S.room){const r=S.room;return[r.name,`<p class="mut">${esc(r.topic)} - ${esc(r.lang)} - ${r.n} people</p><div class="row"><button class="sec" disabled>Voice (coming soon)</button><button class="sec" disabled>Translate (coming soon)</button></div>${sheet()}${msgs(r.msgs)}`,1,1]}
 if(S.dm)return[S.dm,sheet()+msgs(S.dms[S.dm]),1,1];
 if(S.tab=='friends')return['Friends',[...S.friends].filter(f=>!S.blocked.has(f)).map(f=>`<div class="card row"><b>${esc(f)}</b><button class="sec" onclick="dm('${esc(f)}')">Message</button></div>`).join('')||'<p class="mut">No friends yet. Tap a name in a room to add one.</p>'];
 if(S.tab=='me')return['You',`<div class="card"><h3>${esc(S.me)}</h3><small>Coins</small><div style="font-size:28px;font-weight:700;color:var(--gold)">${S.coins}</div><p><button class="pri" onclick="claim()">Claim daily coins</button></p><small>Demo only: no real payments.</small></div><div class="card"><h3>Safety</h3><small>18+ only. Contact details and links are blocked in chat. Report or block anyone from a room.</small></div><p><button class="sec" onclick="S.me=null;render()">Sign out</button></p>`];
 return['Rooms',`<div class="row"><input id="rn" placeholder="Name a new room" maxlength="40"><button class="pri" onclick="mk()">Create</button></div>`+S.rooms.map(r=>`<div class="card"><h3>${esc(r.name)}</h3><small>${esc(r.topic)} - ${esc(r.lang)} - ${r.n} people</small><p style="margin:8px 0 0"><button class="pri" onclick="openRoom(${r.id})">Join</button></p></div>`).join('')]}
function render(){const A=$('#app');
 if(!S.me){A.innerHTML=`<header><span>Ember</span></header><main><h2>Meet people in live chat rooms</h2><p class="mut">Join a room or make your own. Open to adults 18+ worldwide.</p><p><input id="n" placeholder="Display name" maxlength="40"></p><p><small>Date of birth</small><input id="d" type="date"></p><p><button class="pri" onclick="start()">Continue</button></p><p id="e" class="err"></p><small>Demo: sample people are fictional and nothing is saved.</small></main>`;return}
 const[t,h,back,chat]=view();
 A.innerHTML=(S.t?`<div class="toast">${esc(S.t)}</div>`:'')+`<header>${back?'<button onclick="S.room=null;S.dm=null;S.sel=null;render()">Back</button>':''}<span>${esc(t)}</span></header><main>${h}</main>`+
 (chat?`<div class="bar"><input id="m" placeholder="Message" maxlength="500" onkeydown="if(event.key=='Enter')send()"><button class="pri" onclick="send()">Send</button></div>`:`<nav>${['rooms','friends','me'].map(x=>`<button class="${S.tab==x?'on':''}" onclick="go('${x}')">${x[0].toUpperCase()+x.slice(1)}</button>`).join('')}</nav>`);
 const m=$('#m');if(m)m.focus();window.scrollTo(0,document.body.scrollHeight)}
render();
</script></body></html>
